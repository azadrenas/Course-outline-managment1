<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Final International University - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- İsteğe bağlı: Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e7e7e7;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      background: #fff;
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    /* Sol taraf (form) */
    .left-panel {
      flex: 1;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }

    .top-bar .globe {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-right: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    .logo img {
      height: 64px;
      width: auto;
      object-fit: contain;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #111;
    }

    input[type="email"],
    input[type="password"] {
      border: none;
      border-bottom: 2px solid #222;
      padding: 8px 0;
      font-size: 15px;
      outline: none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-bottom-color: #000;
    }

    .password-wrapper {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #222;
      padding: 4px 0;
    }

    .password-wrapper input {
      border: none;
      flex: 1;
      padding: 4px 0;
    }

    .password-toggle {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
    }

    .extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #555;
      margin-top: -8px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remember input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .forgot {
      cursor: pointer;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-btn {
      margin-top: 30px;
      border: none;
      background: #111;
      color: #fff;
      padding: 14px 0;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s ease;
    }

    .login-btn:hover {
      opacity: 0.9;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transform: translateY(-1px);
    }

    /* Sağ taraf (görsel) */
    .right-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .right-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        height: auto;
        max-height: none;
      }

      .right-panel {
        height: 260px;
      }

      .left-panel {
        height: auto;
      }
    }

    @media (max-width: 600px) {
      .left-panel {
        padding: 24px 20px;
      }

      .logo-text {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sol taraf -->
    <div class="left-panel">
      <div>
        <!-- Üstte küçük dünya ikonu (örnek olarak) -->
        <div class="top-bar">
          <div class="globe">🌐</div>
        </div>

        <!-- Logo ve yazı -->
        <div class="logo">
          <!-- Buraya kendi logo görselini koy -->
          <img src="https://www.kibrispostasi.com/upload/news/u/uf/ufu_son_59170221.jpg" alt="Final International University Logo" />
          <div class="logo-text">
            FINAL INTERNATIONAL<br />
            UNIVERSITY
          </div>
        </div>

        <!-- Form -->
        <form>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input id="password" type="password" required />
              <button type="button" class="password-toggle" onclick="togglePassword()">
                👁
              </button>
            </div>
          </div>

          <div class="extra-row">
            <label class="remember">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <span class="forgot">Forgot Password?</span>
          </div>

          <button type="submit" class="login-btn">Log In</button>
        </form>
      </div>
    </div>

    <!-- Sağ taraf: kampüs görseli -->
    <div class="right-panel">
      <!-- Buraya kendi büyük resmini koy -->
      <img src="https://www.studyportalturkey.com/wp-content/uploads/2024/06/n05-6817jpg1718105706.jpg" alt="Final International University Campus" />
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
